name: tests
on: [push, pull_request]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright-core && npx playwright-core install --with-deps chromium
      - run: echo "CHROME_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> $GITHUB_ENV
      - run: node test/run-all.mjs
