<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DiaMetric">
  <!-- Full-bleed achtergrond: veilig als 'maskable' (OS maskeert de randen) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12907C"/>
      <stop offset="1" stop-color="#0A5E52"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Alle inhoud binnen de veilige zone (centrale ~80%) -->
  <g fill="none" stroke="#BDE9DF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M120 300 C 160 300, 176 200, 216 200 S 288 320, 328 320 S 384 232, 400 232"/>
  </g>
  <circle cx="328" cy="320" r="26" fill="#FFFFFF"/>
  <circle cx="328" cy="320" r="26" fill="none" stroke="#0A5E52" stroke-width="6" opacity="0.25"/>
</svg>
